apiVersion: apps/v1
kind: Deployment
metadata:
  name: revision-app
  namespace: day34-revision
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revision-app
  template:
    metadata:
      labels:
        app: revision-app
    spec:
      containers:
        - name: app
          image: winter-arc-app:day32
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: revision-app-config
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
